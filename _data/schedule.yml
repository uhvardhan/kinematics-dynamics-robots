# One entry per week, with its sessions in teaching order. Each session is one
# row on the Schedule page; the Week and Date cells span that week's rows.
# Generated from the Teaching Plan 2026–27 — edit freely from here on.
#
#   week       — week number (the Week column).
#   dates      — the Date column, one per line (here, the week's span). It spans
#                the week's rows until a session in that week has its own date.
#   sessions   — one row each:
#     id         — the Session column. C01–C45 are the core hours, R1–R3 the
#                  conditional reviews in Week 10. "No class" marks the
#                  Sessional Examination I days.
#     date       — the class date, once the timetable is out. When any session
#                  in a week has one, each row of that week shows its own date.
#     unit       — the Unit column (syllabus unit). "" prints an em dash.
#     topic      — the Topic column, printed as written.
#     notes      — the Lecture Notes column: notes, slides or scripts, as
#                  {name, url}. [] prints an em dash.
#     reading    — the Reading column: Niku section numbers. "" prints an em dash.
#     resources  — the Additional Resources column, as {name, url}.
#
# The labels used in resources (Saha, Spong, RA/FDP, RA/Planar, RA/Tutorial, MR)
# are explained in _data/schedule_key.yml, which prints under the table.
#
# A url starting with "/" resolves against the site:
#
#   notes:
#     - name: "Lecture notes (PDF)"
#       url: "/assets/files/C01%20-%20Robots%20as%20mechanisms.pdf"
#
# Write a space in a file name as %20 and an & as %26. An external link (https://…)
# is used as written. A week with no dates and no sessions is left off the page.

